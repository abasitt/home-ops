---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

#vars: not in in used but can be used to simplify https://github.com/onedr0p/cluster-template/blob/main/.taskfiles/Flux/Taskfile.yaml
#  CLUSTER_SECRET_SOPS_FILE: "{{.KUBERNETES_DIR}}/flux/vars/cluster-secrets.sops.yaml"
#  CLUSTER_SETTINGS_FILE: "{{.KUBERNETES_DIR}}/flux/vars/cluster-settings.yaml"
#  GITHUB_DEPLOY_KEY_FILE: "{{.KUBERNETES_DIR}}/bootstrap/cluster-settings/github-deploy-key.sops.yaml"

tasks:

  bootstrap:
    desc: Bootstrap Flux into a Kubernetes cluster
    summary: |
      Args:
        cluster: Cluster to run command against (required)
    prompt: Bootstrap Flux into the '{{.cluster}}' cluster... continue?
    cmds:
      # Apply SOPS-encrypted secrets individually (must decrypt first)
      - sops --decrypt {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/age-key.secret.sops.yaml | kubectl --context {{.cluster}} apply --server-side -f -
      - sops --decrypt {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/github-deploy-key.secret.sops.yaml | kubectl --context {{.cluster}} apply --server-side -f -
      - sops --decrypt {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/cluster-secrets.secret.sops.yaml | kubectl --context {{.cluster}} apply --server-side -f -
      # Apply non-encrypted vars
      - kubectl --context {{.cluster}} apply --server-side -f {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/cluster-settings.yaml
      - |
        if [ -f {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/static-ipam.yaml ]; then
          kubectl --context {{.cluster}} apply --server-side -f {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/static-ipam.yaml
        fi
      # Install flux-operator and flux-instance via helm — takes over from here
      - helm --kube-context {{.cluster}} upgrade --install flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator --namespace flux-system --create-namespace --wait
      - helm --kube-context {{.cluster}} upgrade --install flux-instance oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance --namespace flux-system --values {{.KUBERNETES_DIR}}/{{.cluster}}/apps/flux-system/flux-instance/app/helmrelease.yaml --wait
    preconditions:
      - { msg: "Argument (cluster) is required",        sh: "test -n {{.cluster}}" }
      - { msg: "Age private key not found",             sh: "test -f {{.ROOT_DIR}}/age.key" }
      - { msg: "Age secret not found",                  sh: "test -f {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/age-key.secret.sops.yaml" }
      - { msg: "Github deploy secret not found",        sh: "test -f {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/github-deploy-key.secret.sops.yaml" }
      - { msg: "Cluster settings not found",            sh: "test -f {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/cluster-settings.yaml" }
      - { msg: "Cluster secrets not found",             sh: "test -f {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/cluster-secrets.secret.sops.yaml" }
      - { msg: "Unable to decrypt age secret",          sh: "sops --decrypt {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/age-key.secret.sops.yaml" }
      - { msg: "Unable to decrypt github secret",       sh: "sops --decrypt {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/github-deploy-key.secret.sops.yaml" }
      - { msg: "Unable to decrypt cluster secrets",     sh: "sops --decrypt {{.KUBERNETES_DIR}}/{{.cluster}}/bootstrap/cluster-settings/cluster-secrets.secret.sops.yaml" }

  apply:
    desc: Apply a Flux Kustomization resource for a cluster
    summary: |
      Args:
        cluster: Cluster to run command against (required)
        path: Path to the Flux Kustomization resource (required)
        ns: Namespace the Flux Kustomization exists in (default: flux-system)
    cmd: |
      flux --context {{.cluster}} build ks $(basename {{.path}}) \
          --namespace {{.ns}} \
          --kustomization-file {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.path}}/ks.yaml \
          --path {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.path}} \
          {{- if contains "not found" .ks }}--dry-run \{{ end }}
      | \
      kubectl --context {{.cluster}} apply --server-side \
          --field-manager=kustomize-controller -f -
    requires:
      vars: ["path"]
    vars:
      path: '{{ or .path (fail "Argument (path) is required") }}'
      ns: '{{.ns | default "flux-system"}}'
      ks:
        sh: flux --context {{.cluster}} --namespace {{.ns}} get kustomizations $(basename {{.path}}) 2>&1
    preconditions:
      - { msg: "Argument (cluster) is required", sh: "test -n {{.cluster}}" }
      - { msg: "Kustomization file not found",   sh: "test -f {{.KUBERNETES_DIR}}/{{.cluster}}/apps/{{.path}}/ks.yaml" }

  reconcile:
    desc: Force update Flux to pull in changes from your Git repository
    cmds:
      - flux --context {{.cluster}} reconcile source git flux-system
      - flux --context {{.cluster}} reconcile kustomization cluster-apps
    preconditions:
      - msg: "Argument (cluster) is required"
        sh: test -n "{{.cluster}}"
