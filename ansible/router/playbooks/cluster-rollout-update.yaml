---
- name: Update the single-node router without draining network services
  hosts: kubernetes
  become: true
  gather_facts: true
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    - name: Pausing for 2 seconds...
      ansible.builtin.pause:
        seconds: 2
  tasks:
    - name: Details
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get node {{ inventory_hostname }} -o json
      register: kubectl_get_node
      delegate_to: "{{ groups['master'][0] }}"
      changed_when: false

    - name: Require a Ready and schedulable router
      ansible.builtin.assert:
        that:
          - >-
            ((kubectl_get_node.stdout | from_json).status.conditions
            | selectattr('type', 'equalto', 'Ready')
            | map(attribute='status') | list) == ['True']
          - not ((kubectl_get_node.stdout | from_json).spec.unschedulable | default(false))

    # Draining has nowhere to move services and would discard Kea's emptyDir leases.
    - name: Upgrade host packages without removing packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        force_apt_get: true
        fail_on_autoremove: true
        lock_timeout: 300

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot once when required
      when: reboot_required.stat.exists
      ansible.builtin.reboot:
        msg: Rebooting router after host package updates
        post_reboot_delay: 30
        reboot_timeout: 900

    - name: Wait for Kubernetes readiness after maintenance
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml wait nodes --all --for=condition=Ready=True --timeout=600s
      changed_when: false

    - name: Wait for running router service pods to be Ready
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml
          wait pods --all-namespaces --field-selector=status.phase=Running
          --for=condition=Ready=True --timeout=600s
      changed_when: false

    - name: Verify API and datastore readiness
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get --raw=/readyz
      changed_when: false
