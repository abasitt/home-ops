---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-privategateway
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: ingress-privategateway
  install:
    timeout: 10m
    replace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
    cleanupOnFail: true
    crds: CreateReplace
  test:
    enable: true
  rollback:
    recreate: true
    force: true
    cleanupOnFail: true
  uninstall:
    keepHistory: false
  maxHistory: 3
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: istio-privategateway
              namespace: istio-gateways
            patch: |
              - op: add
                path: /spec/loadBalancerClass
                value: metallb
  valuesFrom:
    - kind: ConfigMap
      name: istioprivategw-helm-values
