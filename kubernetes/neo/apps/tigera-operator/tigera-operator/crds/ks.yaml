---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tigera-operator-crds
  namespace: flux-system
spec:
  path: ./kubernetes/neo/apps/tigera-operator/tigera-operator/crds/config
  prune: false # Protect Calico CRDs and the networking data stored in them.
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: goldmanes.operator.tigera.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: whiskers.operator.tigera.io
  interval: 30m
  retryInterval: 1m
  timeout: 5m
