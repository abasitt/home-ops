---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: qbit
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      qbit:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                  "name": "downloads",
                  "namespace": "kube-system",
                  "interface": "net1",
                  "ips": ["192.168.36.12/23", "2001:470:ee86:36:192:168:36:12/64"],
                  "default-route": ["192.168.36.1", "2001:470:ee86:36:192:168:36:1"]
                }
              ]

        initContainers:
          fixroutes:
            image:
              repository: alpine
              tag: 3.24.1
            env:
            - name: DEV
              value: eth0
            command:
            - '/bin/sh'
            - '-ec'
            - |
              # Clear Calico routes, including both internet defaults.
              ip -4 route flush dev "$DEV"
              ip -6 route flush dev "$DEV"

              # Restore gateway reachability and the existing eth0 exceptions.
              ip -4 route replace 169.254.1.1/32 dev "$DEV"
              ip -6 route replace fe80::/64 dev "$DEV"
              ip -4 route replace 10.0.0.0/8 via 169.254.1.1 dev "$DEV"
              ip -4 route replace 192.168.0.0/16 via 169.254.1.1 dev "$DEV"
              ip -6 route replace 2001:470:ee86::/48 via fe80::ecee:eeff:feee:eeee dev "$DEV"

              # All other traffic must use Gluetun; no eth0 fallback default.
              ip -4 route replace default via 192.168.36.1 dev net1
              ip -6 route replace default via 2001:470:ee86:36:192:168:36:1 dev net1
              ip -4 route get 1.1.1.1 | grep -q 'via 192.168.36.1 dev net1'
              ip -6 route get 2606:4700:4700::1111 | grep -q 'dev net1'
            securityContext:
              capabilities:
                add:
                - NET_ADMIN

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.3@sha256:4fcf15b7f265c2c8d7bc2a7e13240a07e0593c326f3cf3b5b9bb69eec5b79299
            env:
              TZ: ${TIMEZONE}
              QBITTORRENT__PORT: &port 8080
              QBITTORRENT__BT_PORT: &port-bt 50413
            securityContext:
              runAsUser: 2000
              runAsGroup: 2000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 8Gi
    service:
      app:
        controller: qbit
        ports:
          http:
            port: *port
      bittorrent:
        controller: qbit
        #type: LoadBalancer
        annotations:
          prometheus.io/probe: "true"
          prometheus.io/protocol: tcp
        ports:
          bittorrent:
            enabled: true
            port: *port-bt
            protocol: TCP
            targetPort: 6881
    defaultPodOptions:
      nodeSelector:
        feature.node.kubernetes.io/network-interface.bond: "true"

    route:
      app:
        parentRefs:
          - group: ""
            kind: Gateway
            name: private-gateway
            namespace: istio-gateways
        hostnames:
          - "{{ .Release.Name }}.${CLUSTER_DOMAIN}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                port: *port
                name: app
                weight: 100

    persistence:
      config:
        enabled: true
        existingClaim: qbit-config
        advancedMounts:
          qbit:
            app:
              - path: /config
      tmp:
        type: emptyDir
      contents:
        type: nfs
        server: nfs.home.internal
        path: /z1ank/contents
        advancedMounts:
          qbit:
            app:
              - path: /data/nas-contents
