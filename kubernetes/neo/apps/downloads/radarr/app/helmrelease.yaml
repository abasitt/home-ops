---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: radarr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3

  values:
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [
                {
                  "name": "downloads",
                  "namespace": "kube-system",
                  "interface": "net1",
                  "ips": ["192.168.36.13/23", "2001:470:ee86:36:192:168:36:13/64"],
                  "default-route": ["192.168.36.1", "2001:470:ee86:36:192:168:36:1"]
                }
              ]

        initContainers:
          fixroutes:
            image:
              repository: alpine
              tag: 3.24.1
            env:
            - name: DEV
              value: eth0
            command:
            - '/bin/sh'
            - '-ec'
            - |
              # Remove only the Calico defaults; preserve CNI connected routes.
              while ip -4 route show default dev "$DEV" | grep -q '^default'; do
                ip -4 route del default dev "$DEV"
              done
              while ip -6 route show default dev "$DEV" | grep -q '^default'; do
                ip -6 route del default dev "$DEV"
              done

              # Keep the existing cluster/LAN exceptions through eth0.
              ip -4 route replace 10.0.0.0/8 via 169.254.1.1 dev "$DEV"
              ip -4 route replace 192.168.0.0/16 via 169.254.1.1 dev "$DEV"
              ip -6 route replace 2001:470:ee86::/48 via fe80::ecee:eeff:feee:eeee dev "$DEV"

              # All other traffic must use Gluetun; no eth0 fallback default.
              ip -4 route replace default via 192.168.36.1 dev net1
              ip -6 route replace default via 2001:470:ee86:36:192:168:36:1 dev net1
              ip -4 route get 1.1.1.1 | grep -q 'via 192.168.36.1 dev net1'
              ip -6 route get 2606:4700:4700::1111 | grep -q 'dev net1'
            securityContext:
              capabilities:
                add:
                - NET_ADMIN

        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.0.10540@sha256:d380d69c729b4116d224ebb0b4909ff22395fc7b78e8a1976c43ae09430ffc5a
            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__APP__THEME: dark
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__PORT: &port 80
              RADARR__UPDATE__BRANCH: develop
              TZ: ${TIMEZONE}
              RADARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-secret
                    key: api_key
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 15m
              limits:
                memory: 2Gi
            securityContext:
              runAsUser: 2000
              runAsGroup: 2000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      nodeSelector:
        feature.node.kubernetes.io/network-interface.bond: "true"
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ipFamilyPolicy: PreferDualStack
        controller: radarr
        ports:
          http:
            port: *port
    route:
      app:
        parentRefs:
          - group: ""
            kind: Gateway
            name: private-gateway
            namespace: istio-gateways
        hostnames:
          - "{{ .Release.Name }}.${CLUSTER_DOMAIN}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - kind: Service
                port: *port
                name: app
                weight: 100
    persistence:
      config:
        existingClaim: radarr-config
      add-ons:
        type: emptyDir
      tmp:
        type: emptyDir
      contents:
        type: nfs
        server: nfs.home.internal
        path: /z1ank/contents
        globalMounts:
          - path: /data/nas-contents
