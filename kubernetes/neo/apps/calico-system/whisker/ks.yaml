---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: whisker
  namespace: flux-system
spec:
  targetNamespace: calico-system
  dependsOn:
    - name: tigera-operator
    - name: istio-private-gateway
  path: ./kubernetes/neo/apps/calico-system/whisker/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
