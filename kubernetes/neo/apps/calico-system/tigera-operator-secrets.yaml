---
# Allow the operator to provision TLS certificates for Calico components.
# The Helm chart only binds this role in the tigera-operator namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tigera-operator-calico-secrets
  namespace: calico-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tigera-operator-secrets
subjects:
  - kind: ServiceAccount
    name: tigera-operator
    namespace: tigera-operator
