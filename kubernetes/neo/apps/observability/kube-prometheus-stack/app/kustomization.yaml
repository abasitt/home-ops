---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./configs
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./scrapeconfigs
  - ./prometheusrules

configMapGenerator:
  - name: kps-helm-values
    files:
      - values.yaml=./helm-values.yaml
configurations:
  - kustomizeconfig.yaml
