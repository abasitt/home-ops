---
configMaps:
  entrypoint:
    data:
      entrypoint.sh: |
        #!/bin/sh

        # Load the WireGuard configuration from the secret
        cp /tmp/wg-config/wg0.conf /etc/wireguard/wg0.conf

        # Check if wg0 interface exists and shutdown if it does
        if ip link show wg0 > /dev/null 2>&1; then
          wg-quick down wg0
        fi

        # Start WireGuard
        wg-quick up wg0


controllers:
  wg:
    type: deployment
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      hostNetwork: true
    containers:
      wg-app:
        image: &image
          repository: ghcr.io/abasitt/wireguard
          tag: latest@sha256:e2455fb88d0185efc125e9e9e943e9950e2d3229b1079e6d22d6abcfe8776ed9
          pullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -cex
        - |
          bash /tmp/wg-entrypoint/entrypoint.sh
          sleep infinity
        resources:
          requests:
            cpu: "5m"
            memory: "96Mi"
          limits:
            memory: "512Mi"
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        terminationMessagePolicy: FallbackToLogsOnError

persistence:
  wg:
    type: hostPath
    hostPath: /dev/net/tun
    advancedMounts:
      wg:
        wg-app:
          - path: /dev/net/tun
  entrypoint:
    type: configMap
    name: wg-entrypoint
    advancedMounts:
      wg:
        wg-app:
          - path: /tmp/wg-entrypoint
  config:
    enabled: true
    type: secret
    name: wg-config
    advancedMounts:
      wg:
        wg-app:
          - path: /tmp/wg-config

serviceAccount:
  create: true

defaultPodOptions:
  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute
