---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kea-dhcp
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: kea-dhcp
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    chartNameChangeStrategy: InPlaceUpdate
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  postRenderers:
    - kustomize:
        patches:
          # Preserve the existing StatefulSet's immutable selector and serviceName.
          - target:
              kind: StatefulSet
              name: kea-dhcp
            patch: |
              - op: replace
                path: /spec/selector
                value:
                  matchLabels:
                    app.kubernetes.io/instance: kea-dhcp
                    app.kubernetes.io/name: kea-dhcp
              - op: replace
                path: /spec/serviceName
                value: kea-dhcp-headless
  valuesFrom:
    - kind: ConfigMap
      name: keadhcp-helm-values
