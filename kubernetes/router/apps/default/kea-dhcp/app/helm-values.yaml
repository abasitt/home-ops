---
controllers:
  kea-dhcp:
    type: statefulset
    replicas: 1
    revisionHistoryLimit: 10
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
    containers:
      kea:
        image:
          repository: docker.cloudsmith.io/isc/docker/kea-dhcp4
          tag: 3.0.4@sha256:23325c7f239df76e62567c0fbdb7c187491c0192c29aaf64323f8a5b6f7ca186
          pullPolicy: IfNotPresent
        command: ["/usr/sbin/kea-dhcp4"]
        args: ["-c", "/etc/kea/kea-dhcp4.conf"]
    initContainers:
      validate:
        image:
          repository: docker.cloudsmith.io/isc/docker/kea-dhcp4
          tag: 3.0.4@sha256:23325c7f239df76e62567c0fbdb7c187491c0192c29aaf64323f8a5b6f7ca186
          pullPolicy: IfNotPresent
        command: ["/bin/sh", "-ec"]
        args:
          - |
            chmod 750 /var/run/kea /var/lib/kea
            exec /usr/sbin/kea-dhcp4 -t /etc/kea/kea-dhcp4.conf
service:
  headless:
    nameOverride: headless
    controller: kea-dhcp
    primary: true
    clusterIP: None
    ports:
      dhcp:
        port: 67
        protocol: UDP
persistence:
  config:
    type: configMap
    name: kea-dhcp-config
    globalMounts:
      - path: /etc/kea/kea-dhcp4.conf
        subPath: kea-dhcp4.conf
        readOnly: true
  data:
    # Preserve existing behavior: leases survive container restarts, not pod replacement.
    type: emptyDir
    globalMounts:
      - path: /var/lib/kea
  run:
    type: emptyDir
    globalMounts:
      - path: /var/run/kea
