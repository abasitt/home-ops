---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./ocirepository.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: blocky-config
    files:
      - ./config/config.yml
generatorOptions:
  disableNameSuffixHash: true
configurations:
  - kustomizeconfig.yaml